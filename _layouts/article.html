<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | 市集擺攤完全指南</title>
  <meta name="description" content="{{ page.meta_description }}">
  <link rel="canonical" href="https://marketlife101.com/articles/{{ page.slug }}/">
  <link rel="alternate" hreflang="zh-TW" href="https://marketlife101.com/articles/{{ page.slug }}/" />
  <link rel="alternate" hreflang="x-default" href="https://marketlife101.com/articles/{{ page.slug }}/" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; color: #333; background: #fff; line-height: 1.8; }

    /* Header */
    header { background: #4A3525; padding: 16px 24px; }
    header a { color: #fff; text-decoration: none; font-size: 15px; }
    header a:hover { text-decoration: underline; }

    /* Hero image */
    .article-hero { width: 100%; height: 380px; overflow: hidden; background: #e8ddd5; }
    .article-hero img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
    @media (max-width: 600px) { .article-hero { height: 220px; } }

    /* Layout */
    .container { max-width: 800px; margin: 0 auto; padding: 40px 24px 80px; }

    /* Typography */
    h1 { font-size: 2rem; font-weight: 800; line-height: 1.3; margin-bottom: 16px; color: #4A3525; }
    .meta { color: #888; font-size: 14px; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid #eee; }
    h2 { font-size: 1.4rem; font-weight: 700; margin: 44px 0 16px; color: #4A3525; padding-top: 8px; }
    h3 { font-size: 1.15rem; font-weight: 700; margin: 28px 0 12px; color: #333; }
    p { margin-bottom: 16px; }
    ul, ol { margin: 16px 0 16px 24px; }
    li { margin-bottom: 8px; }

    /* Table */
    table { width: 100%; border-collapse: collapse; margin: 24px 0; font-size: 15px; overflow-x: auto; display: block; }
    th { background: #4A3525; color: #fff; padding: 12px 16px; text-align: left; white-space: nowrap; }
    td { padding: 10px 16px; border-bottom: 1px solid #eee; }
    tr:nth-child(even) td { background: #f9f9f9; }

    /* Blockquote */
    blockquote { border-left: 4px solid #D97443; padding: 12px 20px; background: #FDF0E8; margin: 24px 0; border-radius: 0 8px 8px 0; }
    blockquote p { margin-bottom: 0; }

    /* Other */
    strong { color: #4A3525; }
    hr { border: none; border-top: 1px solid #eee; margin: 32px 0; }
    a { color: #D97443; }
    a:hover { color: #B85D2A; }

    /* Images inside article */
    .article-content img {
      width: 100%;
      border-radius: 12px;
      margin: 28px 0;
      display: block;
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
    }

    /* TOC box */
    .toc-box {
      background: #FDF8F4;
      border: 1.5px solid #E8C99A;
      border-radius: 12px;
      padding: 22px 28px;
      margin: 0 0 40px;
    }
    .toc-title {
      font-weight: 700;
      color: #4A3525;
      font-size: 15px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toc-title::before { content: "▋"; color: #D97443; }
    .toc-box ul { margin: 0 0 0 8px; list-style: none; }
    .toc-box li { margin-bottom: 8px; }
    .toc-box a { color: #D97443; text-decoration: none; font-size: 14px; line-height: 1.5; }
    .toc-box a:hover { text-decoration: underline; color: #B85D2A; }
    .toc-box li::before { content: "→ "; color: #D97443; font-size: 12px; }

    /* CTA box */
    .cta-box { background: linear-gradient(135deg, #4A3525 0%, #3D2A18 100%); color: #fff; border-radius: 12px; padding: 32px; margin: 48px 0; text-align: center; }
    .cta-box p { color: rgba(255,255,255,0.85); margin-bottom: 8px; }
    .cta-box a { display: inline-block; background: #D97443; color: #fff; font-weight: 700; padding: 14px 28px; border-radius: 8px; text-decoration: none; margin-top: 16px; font-size: 1rem; }
    .cta-box a:hover { background: #B85D2A; color: #fff; }

    /* Footer */
    footer { text-align: center; padding: 32px; color: #aaa; font-size: 13px; border-top: 1px solid #eee; }
    footer a { color: #4A3525; text-decoration: none; }

    @media (max-width: 600px) {
      h1 { font-size: 1.5rem; }
      .container { padding: 24px 16px 60px; }
      .toc-box { padding: 16px 18px; }
    }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S3LMNRXQMD"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-S3LMNRXQMD");
  </script>
</head>
<body>
  <header>
    <a href="/">← 回到市集擺攤完全指南</a>
  </header>

  {% if page.hero_image %}
  <div class="article-hero">
    <img src="{{ page.hero_image }}" alt="{{ page.title }}" loading="eager">
  </div>
  {% endif %}

  <main class="container">
    <div class="toc-box" id="toc-container" style="display:none">
      <div class="toc-title">目錄｜點選快速跳轉</div>
      <ul id="toc-list"></ul>
    </div>
    <div class="article-content">
      {{ content }}
    </div>
  </main>

  <footer>
    <p>© 2026 市集擺攤完全指南 | <a href="/">回首頁</a></p>
  </footer>

  <script>
    // Auto-generate TOC from h2 headings
    (function() {
      var headings = document.querySelectorAll('.article-content h2');
      if (headings.length < 2) return;
      var tocList = document.getElementById('toc-list');
      var tocContainer = document.getElementById('toc-container');
      headings.forEach(function(h, i) {
        var id = 'section-' + i;
        h.id = id;
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = '#' + id;
        a.textContent = h.textContent.replace(/^\d+\.\s*/, '');
        li.appendChild(a);
        tocList.appendChild(li);
      });
      tocContainer.style.display = 'block';
    })();
  </script>
</body>
</html>
